name: Push to Tidbyt

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 min (GitHub may start runs a few minutes late)
    # Extra runs at :45 so the app leaves at 8:45pm and returns at 7:45am Pacific.
    # Cron is UTC, so each covers both PST and PDT (the off-hour run is harmless).
    - cron: "45 3,4 * * *"   # 8:45pm Pacific
    - cron: "45 14,15 * * *" # 7:45am Pacific
  workflow_dispatch: # "Run workflow" button for manual refreshes
    inputs:
      mode:
        description: "auto = follow quiet hours; day = push now; night = remove now"
        type: choice
        options: [auto, day, night]
        default: auto

concurrency:
  group: tidbyt
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # App settings (these replace the settings screen in the Tidbyt phone app)
      SLUSH_LINE: "44"       # mid-mountain high (°F) where snow turns slushy
      SHOW_ROADS: "true"     # I-80 / SR-89 chain controls when they're up
      FRAME_SECONDS: "6"     # max seconds per screen (capped so the cycle fits Tidbyt's ~15s slot)

      # Quiet hours (Pacific time, 24h HHMM): the app is removed from both
      # Tidbyts so the night clock has the screen to itself.
      QUIET_START: "2045"    # leaves 15 min before the night clock starts (9:00pm)
      QUIET_END: "0745"      # returns 15 min after it ends (7:30am)
    steps:
      - name: Day or night?
        id: mode
        env:
          FORCE: ${{ inputs.mode }}
        run: |
          now=$(TZ=America/Los_Angeles date +%H%M)
          if [ -n "$FORCE" ] && [ "$FORCE" != "auto" ]; then
            mode="$FORCE"
          elif [ "$now" -ge "$QUIET_START" ] || [ "$now" -lt "$QUIET_END" ]; then
            mode=night
          else
            mode=day
          fi
          echo "Pacific time $now -> $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Install Pixlet
        run: |
          curl -sSfL https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz | tar -xz pixlet
          ./pixlet version

      - name: Render
        if: steps.mode.outputs.mode == 'day'
        run: |
          ./pixlet render palisades_snow.star \
            slush="$SLUSH_LINE" \
            show_roads="$SHOW_ROADS" \
            frame_seconds="$FRAME_SECONDS" \
            -o snow.webp

      - name: Update Tidbyt
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
        run: ./update-device.sh

      - name: Update work Tidbyt
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_WORK_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_WORK_DEVICE_ID }}
        run: ./update-device.sh
