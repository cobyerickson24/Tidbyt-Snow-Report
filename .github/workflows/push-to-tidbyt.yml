name: Push to Tidbyt

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 min (GitHub may start runs a few minutes late)
  workflow_dispatch: # "Run workflow" button for manual refreshes

concurrency:
  group: tidbyt
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # App settings (these replace the settings screen in the Tidbyt phone app)
      SLUSH_LINE: "44"       # mid-mountain high (°F) where snow turns slushy
      SNOW_THRESHOLD: "6"    # inches in a day that counts as a real snow day
      SHOW_WEEKEND: "true"   # Sat/Sun outlook, Wed-Fri
      SHOW_ROADS: "true"     # I-80 / SR-89 chain controls when they're up
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixlet
        run: |
          curl -sSfL https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz | tar -xz pixlet
          ./pixlet version

      - name: Render
        run: |
          ./pixlet render palisades_snow.star \
            slush="$SLUSH_LINE" \
            snow_threshold="$SNOW_THRESHOLD" \
            show_weekend="$SHOW_WEEKEND" \
            show_roads="$SHOW_ROADS" \
            -o snow.webp

      - name: Push to device
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
        run: |
          ./pixlet push \
            --api-token "$TIDBYT_API_TOKEN" \
            --installation-id palisadessnow \
            --background \
            "$TIDBYT_DEVICE_ID" snow.webp
